name: Merge AdGuard DNS filters

on:
  schedule:
    - cron: '0 19 * * *'   # 北京时间每天 03:00（UTC 19:00 前一天）
  workflow_dispatch:       # 支持手动触发测试

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 合并并去重
        run: bash merge.sh

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merged.txt
          if git diff --cached --quiet; then
            echo "规则无变化，跳过提交"
          else
            git commit -m "chore: 每日合并 DNS 过滤规则"
            git push
          fi
